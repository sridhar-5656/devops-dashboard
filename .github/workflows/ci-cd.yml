name: CI/CD DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Flask App import
      run: |
        python -c "import app; print('Flask App loaded successfully')"

    - name: Build Docker Image
      run: |
        docker build -t sridhar553/devops-dashboard:latest .

    - name: Verify Container Execution & Health Check
      run: |
        docker run -d -p 8080:8080 --name test-dashboard sridhar553/devops-dashboard:latest
        sleep 3
        curl -f http://localhost:8080/health || exit 1

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker Image to Docker Hub
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        docker push sridhar553/devops-dashboard:latest


