name: CI/CD DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Flask App import
      # Example: Accessing GitHub Secrets via environment variables
      # Secrets added in Repo Settings -> Secrets and variables -> Actions
      # are accessible using ${{ secrets.SECRET_NAME }}
      env:
        APP_SECRET: ${{ secrets.APP_SECRET }}
      run: |
        python -c "import app; print('Flask App loaded successfully')"

    - name: Build Docker Image
      run: |
        docker build -t devops-dashboard:latest .

    - name: Verify Container Execution & Health Check
      env:
        APP_SECRET: ${{ secrets.APP_SECRET }}
      run: |
        docker run -d -p 8080:8080 -e APP_SECRET="${APP_SECRET}" --name test-dashboard devops-dashboard:latest
        sleep 3
        curl -f http://localhost:8080/health || exit 1

